services:
  - type: web
    name: parque-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parque-db
          property: connectionString

databases:
  - name: parque-db
    plan: free
    databaseName: parque
    user: parque
